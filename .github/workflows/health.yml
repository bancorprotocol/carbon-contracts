name: Health

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *' # every 2 hours

jobs:
  test:
    name: Health Checks

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.5 # stable version 09.09.2025

      # remappings resolve @openzeppelin, @bancor and hardhat-deploy from node_modules
      - name: Install dependencies
        run: pnpm install

      - name: Storage gaps
        run: pnpm test:storage

      # forks mainnet from utils/rpcUrls.json; set the MAINNET_RPC_URL secret to use a dedicated endpoint instead
      - name: Mainnet health on a fork
        run: pnpm test:health
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
